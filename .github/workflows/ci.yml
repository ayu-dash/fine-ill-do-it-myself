name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: scripts/test-run-installer.sh

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - name: Package release tarball
        run: |
          mkdir -p dist
          cp target/release/fidim dist/
          cp README.md dist/
          tar -czf "fine-ill-do-it-myself-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" -C dist .
          scripts/build-run-installer.sh target/release/fidim \
            "fine-ill-do-it-myself-${GITHUB_REF_NAME}-x86_64-linux.run"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            fine-ill-do-it-myself-*.tar.gz
            fine-ill-do-it-myself-*.run
