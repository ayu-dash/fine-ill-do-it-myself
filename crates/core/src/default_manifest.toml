# Default download manifest for fidim.
# Update versions here without touching code. sha256 left empty = recorded on
# first install into lock.toml and verified on later (re)installs.
#
# install_dir: extract tarball into .fidim/runtimes/<install_dir>/
# strip_components: strip N leading path components (1 for version-prefixed tarballs)
# files: which binaries to symlink from the runtime dir into bin/<lang>/
#        format: "runtime/rel/path:bin/dest/rel"

[[binaries]]
name = "caddy"
version = "2.10.2"
url = "https://github.com/caddyserver/caddy/releases/download/v2.10.2/caddy_2.10.2_linux_amd64.tar.gz"
sha256 = "5c218bc34c9197369263da7e9317a83acdbd80ef45d94dca5eff76e727c67cdd"
tar_gz = true
files = ["caddy"]

